services:
  web:
    build:
      context: ./src/Accounts.Web
    ports:
      - "1000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      ExternalAccountsApi__BaseUrl: "http://orchestration-api:8080"
    secrets:
      - source: Auth0Domain
        target: Auth0:Domain
      - source: AccountsApplicationApiKey
        target: AccountsApplicationApiKey
      - source: Auth0ClientId
        target: Auth0:ClientId
      - source: Auth0ClientSecret
        target: Auth0:ClientSecret
    depends_on:
      - orchestration-api
    restart: unless-stopped

  orchestration-api:
    build:
      context: .
      dockerfile: src/Accounts.OrchestrationApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      ExternalDbApi__BaseUrl: "http://data-api:8081"
    secrets:
      - source: AccountsApplicationApiKey
        target: AccountsApplicationApiKey
      - source: AccountsApiKey
        target: AccountsApiKey
      - source: Auth0Domain
        target: Auth0:Domain
      - source: Auth0OrchestrationClientSecret
        target: Auth0:ClientSecret
      - source: Auth0OrchestrationClientId
        target: Auth0:ClientId
    depends_on:
      - data-api
    restart: unless-stopped

  data-api:
    build:
      context: .
      dockerfile: src/Accounts.DataApi/AccountsAPI/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__AccountsDb: "Host=db;Port=5432;Database=accountsdata;Username=accounts_app"
    secrets:
      - source: DbAppPassword
        target: Database:AppPassword
      - source: Auth0Domain
        target: Auth0:Domain
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: accountsdata
      POSTGRES_USER: accounts_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/DbAdminPassword
    secrets:
      - DbAdminPassword
      - DbAppPassword
    volumes:
      - db-data:/var/lib/postgresql
      - ./DbFiles/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  db-data:

secrets:
  AccountsApiKey:
    file: ./secrets/DataApi/AccountsApiKey.txt
  AccountsApplicationApiKey:
    file: ./secrets/OrchestrationApi/AccountsApplicationApiKey.txt
  Auth0ClientId:
    file: ./secrets/Front/Auth0ClientId.txt
  Auth0ClientSecret:
    file: ./secrets/Front/Auth0ClientSecret.txt
  DbAdminPassword:
    file: ./secrets/DataApi/DbAdminPassword.txt
  DbAppPassword:
    file: ./secrets/DataApi/DbAppPassword.txt
  Auth0Domain:
    file: ./secrets/Shared/Auth0Domain.txt
  Auth0OrchestrationClientSecret:
    file: ./secrets/OrchestrationApi/Auth0ClientSecret.txt
  Auth0OrchestrationClientId:
    file: ./secrets/OrchestrationApi/Auth0ClientId.txt