

services:
  portfoliofe:
    image: eliseshub/accountsfront:latest
    ports:
      - "1000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      ExternalAccountsApi__BaseUrl: "http://accountsapplicationapi:8080"
      Auth0__Domain: ${AUTH0_DOMAIN}
    secrets:
      - source: AccountsApplicationApiKey
        target: AccountsApplicationApiKey
      - source: Auth0ClientId
        target: Auth0:ClientId
      - source: Auth0ClientSecret
        target: Auth0:ClientSecret
    depends_on:
      - accountsapplicationapi
    restart: unless-stopped


  accountsapplicationapi:
    image: eliseshub/accountsapplicationapi:latest
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      ExternalDbApi__BaseUrl: "http://accountsapi:8080"
    secrets:
      - source: AccountsApiKey
        target: AccountsApiKey
      - source: AccountsApplicationApiKey
        target: AccountsApplicationApiKey
    depends_on:
      - accountsapi
    restart: unless-stopped

  accountsapi:
    image: eliseshub/accountsapi:latest
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__AccountsDb: "Server=accountsdb;Port=3306;Database=AccountsDb;User ID=accounts_user;Password=${MYSQL_PASSWORD};"
    secrets:
      - source: AccountsApiKey
        target: AccountsApiKey
    depends_on:
      accountsdb:
        condition: service_healthy
    restart: unless-stopped

  accountsdb:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: AccountsDb
      MYSQL_USER: accounts_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mySQLDb/accountsdb_dump_v1.sql:/docker-entrypoint-initdb.d/accountsdb_dump_v1.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql-data:

secrets:
  AccountsApiKey:
    file: ./secrets/AccountsApiKey.txt
  AccountsApplicationApiKey:
    file: ./secrets/AccountsApplicationApiKey.txt
  Auth0ClientId:
    file: ./secrets/Auth0ClientId.txt
  Auth0ClientSecret:
    file: ./secrets/Auth0ClientSecret.txt