services:
  web:
    build:
      context: ./src/Accounts.Web
    ports:
      - "1000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      ExternalAccountsApi__BaseUrl: "http://orchestration-api:8080"
      Auth0__Domain: your-tenant.eu.auth0.com
    secrets:
      - source: AccountsApplicationApiKey
        target: AccountsApplicationApiKey
      - source: Auth0ClientId
        target: Auth0:ClientId
      - source: Auth0ClientSecret
        target: Auth0:ClientSecret
    depends_on:
      - orchestration-api
    restart: unless-stopped

  orchestration-api:
    build:
      context: .
      dockerfile: src/Accounts.OrchestrationApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      ExternalDbApi__BaseUrl: "http://data-api:8081"
    secrets:
      - source: AccountsApiKey
        target: AccountsApiKey
      - source: AccountsApplicationApiKey
        target: AccountsApplicationApiKey
    depends_on:
      - data-api
    restart: unless-stopped

  data-api:
    build:
      context: .
      dockerfile: src/Accounts.DataApi/AccountsAPI/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    secrets:
      - source: AccountsApiKey
        target: AccountsApiKey
      - source: AccountsDbConnectionString
        target: ConnectionStrings:AccountsDb
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: AccountsDb
      MYSQL_USER: accounts_user
      MYSQL_PASSWORD_FILE: /run/secrets/MySQLPassword
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/MySQLRootPassword
    secrets:
      - MySQLPassword
      - MySQLRootPassword
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mySQLDb/accountsdb_dump_v1.sql:/docker-entrypoint-initdb.d/accountsdb_dump_v1.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$(cat /run/secrets/MySQLRootPassword)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql-data:

secrets:
  AccountsApiKey:
    file: ./secrets/AccountsApiKey.txt
  AccountsApplicationApiKey:
    file: ./secrets/AccountsApplicationApiKey.txt
  Auth0ClientId:
    file: ./secrets/Auth0ClientId.txt
  Auth0ClientSecret:
    file: ./secrets/Auth0ClientSecret.txt
  MySQLPassword:
    file: ./secrets/MySQLPassword.txt
  MySQLRootPassword:
    file: ./secrets/MySQLRootPassword.txt
  AccountsDbConnectionString:
    file: ./secrets/AccountsDbConnectionString.txt