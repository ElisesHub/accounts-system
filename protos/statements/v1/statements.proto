syntax = "proto3";

package statements.v1;

import "google/type/money.proto";
import "google/protobuf/timestamp.proto";
option csharp_namespace = "Statements.Api.V1";

service StatementsService{
  rpc GetTransactions(GetTransactionsRequest) returns (stream GetTransactionsResponse);
}

message Transaction{
  int64 transaction_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  google.type.Money amount = 3;
  optional string counterparty_name = 4;
  string description = 5;
  string transaction_type = 6;
}

message GetTransactionsResponse{
  Transaction transaction = 1;
}

message GetTransactionsRequest{
  int32 account_id = 1;
}