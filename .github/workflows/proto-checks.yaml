name: Proto checks

on: pull_request

permissions:
  contents: read

jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Lint
        run: buf lint

      - name: Breaking changes
        run: buf breaking --against "https://github.com/${{ github.repository }}.git#branch=${{ github.base_ref }}"